<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公开 Voice V1 单次验收</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      color: #514b64;
      background: #faf9fd;
      font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
    }
    main {
      width: min(440px, calc(100vw - 28px));
      min-height: 300px;
      padding: 36px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      border: 1px solid rgba(202, 194, 221, .45);
      border-radius: 28px;
      background: rgba(255, 255, 255, .76);
      box-shadow: 0 18px 56px rgba(92, 79, 121, .1);
    }
    button {
      padding: 10px 18px;
      border: 1px solid #baa8df;
      border-radius: 999px;
      color: #55476d;
      background: #e4dbf7;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { cursor: not-allowed; opacity: .55; }
    #status { margin: 0; color: #756b88; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <cat-ear-player id="smokePlayer" color="#D8CEF2"></cat-ear-player>
    <button id="generateOnce" type="button">生成一次</button>
    <p id="status" role="status" aria-live="polite">等待点击生成一次</p>
  </main>
  <script type="module">
    import './cat-ear-player.js';

    const SMOKE_TEXT = '你好，这是公开语音气泡。';
    const ATTEMPT_KEY = 'public-v1-minimax-smoke-attempted-v1';
    const player = document.querySelector('#smokePlayer');
    const button = document.querySelector('#generateOnce');
    const status = document.querySelector('#status');
    let started = false;

    function disableGeneration() {
      started = true;
      button.disabled = true;
    }

    function safeErrorCode(error) {
      const candidate = error && typeof error.code === 'string'
        ? error.code
        : error && typeof error.message === 'string'
          ? error.message
          : '';
      return /^[A-Z][A-Z0-9_]{0,63}$/.test(candidate) ? candidate : 'SMOKE_REQUEST_FAILED';
    }

    function hasAttempted() {
      try {
        return sessionStorage.getItem(ATTEMPT_KEY) === 'yes';
      } catch {
        return true;
      }
    }

    if (hasAttempted()) {
      disableGeneration();
      status.textContent = '本标签页已执行过单次验收';
    }

    button.addEventListener('click', async () => {
      if (started || button.disabled) {
        return;
      }

      try {
        sessionStorage.setItem(ATTEMPT_KEY, 'yes');
      } catch {
        disableGeneration();
        status.textContent = '无法建立单次门禁，未发送请求';
        return;
      }
      button.disabled = true;
      started = true;

      status.textContent = '正在生成';
      try {
        await player.synthesize(SMOKE_TEXT);
        status.textContent = '生成成功，请点击猫耳气泡播放';
      } catch (error) {
        status.textContent = `生成失败：${safeErrorCode(error)}`;
      }
    });
  </script>
</body>
</html>
